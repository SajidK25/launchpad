services:
  postgres:
    image: postgres@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    environment:
      POSTGRES_DB: launchpad_check
      POSTGRES_PASSWORD: launchpad_check_password
      POSTGRES_USER: launchpad_check
    volumes:
      - check_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchpad_check -d launchpad_check"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - check_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_PASSWORD: launchpad_check_minio_password
      MINIO_ROOT_USER: launchpad_check_minio
    volumes:
      - check_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  python-checks:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    working_dir: /workspace
    environment:
      MYPY_CACHE_DIR: /tmp/mypy-cache
      PYTEST_ADDOPTS: -p no:cacheprovider
      RUFF_CACHE_DIR: /tmp/ruff-cache
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
    command: ["python", "--version"]

  integration:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    working_dir: /workspace
    environment:
      AWS_ACCESS_KEY_ID: launchpad_check_minio
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_SECRET_ACCESS_KEY: launchpad_check_minio_password
      DATABASE_URL: postgresql://launchpad_check:launchpad_check_password@postgres:5432/launchpad_check
      LAUNCHPAD_ENVIRONMENT: check
      MYPY_CACHE_DIR: /tmp/mypy-cache
      PYTEST_ADDOPTS: -p no:cacheprovider
      REDIS_URL: redis://redis:6379/0
      RUFF_CACHE_DIR: /tmp/ruff-cache
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "pytest"]

  prepare:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    working_dir: /workspace
    environment:
      LAUNCHPAD_DATABASE_URL: postgresql://launchpad_check:launchpad_check_password@postgres:5432/launchpad_check
      LAUNCHPAD_STORAGE_ACCESS_KEY_ID: launchpad_check_runtime
      LAUNCHPAD_STORAGE_SECRET_ACCESS_KEY: launchpad_check_runtime_password
      LAUNCHPAD_BOOTSTRAP_STORAGE_ACCESS_KEY_ID: launchpad_check_minio
      LAUNCHPAD_BOOTSTRAP_STORAGE_SECRET_ACCESS_KEY: launchpad_check_minio_password
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.bootstrap"]

  gated-consumer:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    working_dir: /workspace
    depends_on:
      prepare:
        condition: service_completed_successfully
    command: ["python", "-c", "print('prepared-consumer')"]

  api:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    depends_on:
      prepare:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  web-checks:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: tooling
    working_dir: /workspace
    volumes:
      - type: bind
        source: ./apps/web
        target: /workspace/apps/web
        read_only: true
      - type: bind
        source: ./packages/contracts
        target: /workspace/packages/contracts
      - type: bind
        source: ./scripts/quality
        target: /workspace/scripts/quality
        read_only: true
    command: ["npm", "--version"]

  worker:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    depends_on:
      prepare:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      LAUNCHPAD_REDIS_URL: redis://redis:6379/0
    command: ["python", "apps/worker/worker.py"]
    healthcheck:
      test: ["CMD", "python", "apps/worker/worker.py", "--health"]
      interval: 5s
      timeout: 3s
      retries: 3

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    depends_on:
      prepare:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      LAUNCHPAD_REDIS_URL: redis://redis:6379/0
    command: ["python", "apps/worker/scheduler.py"]
    healthcheck:
      test: ["CMD", "python", "apps/worker/scheduler.py", "--health"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  check_minio_data:
  check_postgres_data:
  check_redis_data:
