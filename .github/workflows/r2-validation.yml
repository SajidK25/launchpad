name: Protected R2 validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: r2-validation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked validation dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Validate isolated private R2 bucket
        env:
          LAUNCHPAD_R2_VALIDATION_ENABLED: "1"
          LAUNCHPAD_R2_VALIDATION_BUCKET: ${{ vars.LAUNCHPAD_R2_VALIDATION_BUCKET }}
          LAUNCHPAD_R2_PRODUCTION_BUCKET: ${{ vars.LAUNCHPAD_R2_PRODUCTION_BUCKET }}
          LAUNCHPAD_R2_ACCOUNT_ID: ${{ vars.LAUNCHPAD_R2_ACCOUNT_ID }}
          LAUNCHPAD_R2_ENDPOINT_URL: ${{ secrets.LAUNCHPAD_R2_VALIDATION_ENDPOINT_URL }}
          LAUNCHPAD_R2_ACCESS_KEY_ID: ${{ secrets.LAUNCHPAD_R2_VALIDATION_ACCESS_KEY_ID }}
          LAUNCHPAD_R2_SECRET_ACCESS_KEY: ${{ secrets.LAUNCHPAD_R2_VALIDATION_SECRET_ACCESS_KEY }}
        run: python -m pytest -q tests/integration/test_r2_validation.py
