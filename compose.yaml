services:
  postgres:
    image: postgres@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    environment:
      POSTGRES_DB: launchpad_development
      POSTGRES_PASSWORD: launchpad_development_password
      POSTGRES_USER: launchpad_development
    volumes:
      - development_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchpad_development -d launchpad_development"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - development_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_PASSWORD: launchpad_development_minio_password
      MINIO_ROOT_USER: launchpad_development_minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - development_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  prepare:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    environment:
      LAUNCHPAD_DATABASE_URL: postgresql://launchpad_development:launchpad_development_password@postgres:5432/launchpad_development
      LAUNCHPAD_STORAGE_ACCESS_KEY_ID: launchpad_development_minio_runtime
      LAUNCHPAD_STORAGE_SECRET_ACCESS_KEY: launchpad_development_minio_runtime_password
      LAUNCHPAD_BOOTSTRAP_STORAGE_ACCESS_KEY_ID: launchpad_development_minio
      LAUNCHPAD_BOOTSTRAP_STORAGE_SECRET_ACCESS_KEY: launchpad_development_minio_password
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.bootstrap"]

  api:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    depends_on:
      prepare:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    depends_on:
      prepare:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      LAUNCHPAD_REDIS_URL: redis://redis:6379/0
    command: ["python", "apps/worker/worker.py"]
    healthcheck:
      test: ["CMD", "python", "apps/worker/worker.py", "--health"]
      interval: 5s
      timeout: 3s
      retries: 3

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    depends_on:
      prepare:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      LAUNCHPAD_REDIS_URL: redis://redis:6379/0
    command: ["python", "apps/worker/scheduler.py"]
    healthcheck:
      test: ["CMD", "python", "apps/worker/scheduler.py", "--health"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  development_minio_data:
  development_postgres_data:
  development_redis_data:
