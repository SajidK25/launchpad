[build-system]
requires = ["setuptools==80.10.1"]
build-backend = "setuptools.build_meta"

[project]
name = "launchpad-api"
version = "0.1.0"
description = "Launchpad API and worker foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtplib==5.1.3",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "asyncpg==0.31.0",
    "boto3==1.43.97",
    "cryptography==50.0.1",
    "dramatiq==2.2.1",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "httpx2==2.13.0",
    "minio==7.2.20",
    "Pillow==12.3.0",
    "pydantic-settings==2.15.0",
    "redis==8.1.0",
    "SQLAlchemy==2.0.54",
    "strawberry-graphql==0.327.7",
    "uuid6==2025.0.1",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["apps/api", "tests"]
pythonpath = ["apps/api"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", ".mypy_cache", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["apps/api"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["asyncpg", "boto3", "botocore.*"]
ignore_missing_imports = true
