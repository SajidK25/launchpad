map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s;
    server_tokens off;

    client_max_body_size 5m;
    client_body_timeout 15s;
    client_body_temp_path /tmp/nginx/client_body 1 2;
    default_type text/plain;

    set $api_upstream http://api:8000;
    error_page 418 = @launchpad_maintenance;

    location @launchpad_maintenance {
        internal;
        default_type text/plain;
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
        return 503 "Launchpad is temporarily unavailable for maintenance.\n";
    }

    location = /api/v1/health/ready {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Production traffic is admitted only through the loopback-bound Cloudflare Tunnel.
        # Cloudflare overwrites CF-Connecting-IP with the visitor address; forward that
        # value so API source limits distinguish visitors behind the tunnel.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ {
        if (-f /run/launchpad/state/maintenance) {
            return 418;
        }

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_request_buffering on;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        if (-f /run/launchpad/state/maintenance) {
            return 418;
        }

        try_files $uri $uri/ /index.html;
    }
}
