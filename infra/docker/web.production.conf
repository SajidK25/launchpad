map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s;
    server_tokens off;

    client_max_body_size 5m;
    client_body_timeout 15s;
    client_body_temp_path /tmp/nginx/client_body 1 2;
    default_type text/plain;

    set $api_upstream http://api:8000;

    location = /api/v1/health/ready {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ {
        if (-f /run/launchpad/state/maintenance) {
            return 503 "Launchpad is temporarily unavailable for maintenance.\n";
        }

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_request_buffering on;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        if (-f /run/launchpad/state/maintenance) {
            return 503 "Launchpad is temporarily unavailable for maintenance.\n";
        }

        try_files $uri $uri/ /index.html;
    }
}
