query PublicProfile($accountId: UUID!) {
  publicProfile(accountId: $accountId) {
    accountId
    displayName
    bio
    links
    photoUrl
  }
}

query ViewerProfile {
  viewerProfile {
    accountId
    displayName
    bio
    links
    photoUrl
    visibility
    version
  }
}

query ViewerProducts($first: Int! = 20, $after: String) {
  viewerProducts(first: $first, after: $after) {
    items {
      id
      status
      version
      name
      pitch
      createdAt
      updatedAt
    }
    nextCursor
  }
}

query ViewerProduct($id: UUID!) {
  viewerProduct(id: $id) {
    summary {
      id
      status
      version
      name
      pitch
      createdAt
      updatedAt
    }
    description
    websiteUrl
    topics {
      id
      displayName
      position
    }
    assets {
      id
      kind
      mediaType
      byteCount
      url
    }
    submission {
      id
      submittedAt
      productVersion
    }
    reviewOutcome {
      status
      feedback
    }
  }
}

query ReviewQueue($first: Int! = 20, $after: String) {
  reviewQueue(first: $first, after: $after) {
    items {
      product {
        id
        status
        version
        name
        pitch
        createdAt
        updatedAt
      }
      submission {
        id
        submittedAt
        productVersion
      }
      possibleDuplicate
      founderSuspended
    }
    nextCursor
  }
}

query ReviewProduct($id: UUID!) {
  reviewProduct(id: $id) {
    product {
      summary {
        id
        status
        version
        name
        pitch
        createdAt
        updatedAt
      }
      description
      websiteUrl
      topics {
        id
        displayName
        position
      }
      assets {
        id
        kind
        mediaType
        byteCount
        url
      }
      submission {
        id
        submittedAt
        productVersion
      }
    }
    submission {
      id
      submittedAt
      productVersion
    }
    possibleDuplicate
    founderSuspended
  }
}

query ApprovedReviews($first: Int! = 20, $after: String) {
  approvedReviews(first: $first, after: $after) {
    items {
      product {
        id
        status
        version
        name
        pitch
        createdAt
        updatedAt
      }
      submission {
        id
        submittedAt
        productVersion
      }
      approvedAt
    }
    nextCursor
  }
}

query ViewerNotificationInbox($first: Int! = 20, $after: String) {
  viewerNotificationInbox(first: $first, after: $after) {
    items {
      id
      productId
      kind
      createdAt
      readAt
    }
    unreadCount
    nextCursor
  }
}

query ViewerLaunchBookings($first: Int! = 20, $after: String) {
  viewerLaunchBookings(first: $first, after: $after) {
    items {
      id
      productId
      state
      productStatus
      launchAt
      failureReason
      createdAt
      closedAt
    }
    nextCursor
  }
}

query ViewerLaunchNotificationPreferences {
  viewerLaunchNotificationPreferences {
    reminderEmail
    reminderInSite
    liveEmail
    liveInSite
    failureEmail
    failureInSite
  }
}

query PublicProduct($id: UUID!) {
  publicProduct(id: $id) {
    id
    name
    pitch
    description
    websiteUrl
    launchedAt
    logo {
      id
      kind
      mediaType
      byteCount
      url
    }
    screenshots {
      id
      kind
      mediaType
      byteCount
      url
    }
    topics
  }
}

query PublicLaunches($date: Date, $first: Int! = 20, $after: String) {
  publicLaunches(date: $date, first: $first, after: $after) {
    todayDate
    selectedDate
    items {
      id
      name
      pitch
      logoUrl
      topics
    }
    nextCursor
  }
}

query TopicChoices($first: Int! = 20, $query: String) {
  topicChoices(first: $first, query: $query) {
    id
    displayName
  }
}
